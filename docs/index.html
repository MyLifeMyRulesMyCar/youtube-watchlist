<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
var PLAYLISTS = {"AI": [{"playlist": "AI", "channel": "Fireship", "title": "A $6.3 billion open-weight model just got embarrassed by the French...", "url": "https://www.youtube.com/watch?v=WrCjAAl9okA", "published": "2026-10-07"}, {"playlist": "AI", "channel": "Fireship", "title": "PewDiePie is setting AI free... and OpenAI is furious", "url": "https://www.youtube.com/watch?v=_5p1_TNSWqQ", "published": "2026-10-05"}, {"playlist": "AI", "channel": "MReflow", "title": "AI News: Haiku-5.5, Visual ChatGPT, Grok's New Trick, and more!", "url": "https://www.youtube.com/watch?v=NUizyuGj-kE", "published": "2026-10-09"}, {"playlist": "AI", "channel": "MReflow", "title": "AI Design Hack Saves HOURS", "url": "https://www.youtube.com/watch?v=grOilk8aCS0", "published": "2026-10-08"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Everything has been solved", "url": "https://www.youtube.com/watch?v=cX2kD2yQf88", "published": "2026-10-10"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "AI Is Recreating Photoshop and Other Adobe Apps", "url": "https://www.youtube.com/watch?v=TqxHhuOve2Q", "published": "2026-10-10"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Tesla Powerwall and Car Backup During an Outage", "url": "https://www.youtube.com/watch?v=o_gf-LEaOWw", "published": "2026-10-09"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Mistral Large 4 Failed My Rubik's Cube Test", "url": "https://www.youtube.com/watch?v=QnxXx1FpnF8", "published": "2026-10-08"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "12 Grok Bot Use Cases That Feel Illegal", "url": "https://www.youtube.com/watch?v=BsNHg6cNjZE", "published": "2026-10-07"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "How to Find Nano Banana 2.1 in Google AI Studio", "url": "https://www.youtube.com/watch?v=EItxPNgKOX4", "published": "2026-10-07"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Mistral is BACK! (Le Chonk)", "url": "https://www.youtube.com/watch?v=Hu1JOK6aXsI", "published": "2026-10-07"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Video Game Mashups: Minecraft and Mario in Elden Ring", "url": "https://www.youtube.com/watch?v=yrn7FqgVOW8", "published": "2026-10-06"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Gemini Agent: Google\u2019s Answer to Dots and Muse, Built for Companies Work", "url": "https://www.youtube.com/watch?v=esT15oQJaqg", "published": "2026-10-10"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenHuman: Free Second Brain Runs on your Machine, 25x Less Memory", "url": "https://www.youtube.com/watch?v=MQKmqP9sYUc", "published": "2026-10-09"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "EmbeddingGemma 2 + Gemma 4: A Fully Local Multimodal RAG Stack", "url": "https://www.youtube.com/watch?v=UFNNYEFt4gs", "published": "2026-10-08"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenAI Cut Codex Limits, Now It Promises 28 Days of Upgrades", "url": "https://www.youtube.com/watch?v=Ao6c9SGPMKU", "published": "2026-10-07"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Pi 2.0 Is Out: Native MCP, Codemode, and Model Routing Explained", "url": "https://www.youtube.com/watch?v=b1T5DibaVek", "published": "2026-10-06"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Manus 2.0: AI Agents With Their Own Email, Phone Number and Wallet", "url": "https://www.youtube.com/watch?v=Z6g79U5phQQ", "published": "2026-10-05"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "Encrypting Your Data", "url": "https://www.youtube.com/watch?v=2FNhbXc2Yzk", "published": "2026-10-11"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Linux anyone can use. Raspberry Pi OS Now 64bit X64", "url": "https://www.youtube.com/watch?v=lgPHr1XYe54", "published": "2026-10-08"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Raspberry Pi News 108. Upgrading RAM blocked!", "url": "https://www.youtube.com/watch?v=TIsgfDtCAHU", "published": "2026-10-05"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "CEX Barnstaple Fire. 4th October 2026", "url": "https://www.youtube.com/watch?v=zOP2-DARV_M", "published": "2026-10-05"}, {"playlist": "Hardware", "channel": "Jeff Geerling", "title": "Qualcomm made a Pi 5 killer. Good luck getting one.", "url": "https://www.youtube.com/watch?v=KUUuxkICOLw", "published": "2026-10-09"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "DDR3 Rides Again, ft. Wendell of Level1 Techs", "url": "https://www.youtube.com/watch?v=e4c2FSSaCsw", "published": "2026-10-10"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "HW News - Discord ID Verification Fail, 5090s Too Valuable for RMA, Jensen is Just Like Us", "url": "https://www.youtube.com/watch?v=ms0Z-qc8KzY", "published": "2026-10-07"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
