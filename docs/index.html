<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Playlist</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
var VIDEOS = [{"channel": "Fireship", "title": "DeepSeek is back... and Silicon Valley is terrified", "url": "https://www.youtube.com/watch?v=xBByvFrqmWU", "published": "2026-08-20"}, {"channel": "Fireship", "title": "The summer Math fell to the machines...", "url": "https://www.youtube.com/watch?v=iuZPTE5qsJY", "published": "2026-08-19"}, {"channel": "MReflow", "title": "The Wildest Smartphone I\u2019ve Ever Seen \ud83e\udd2f", "url": "https://www.youtube.com/watch?v=aOzaO5AAGjk", "published": "2026-08-22"}, {"channel": "MReflow", "title": "This Pyramid Could Be Your Next Intern", "url": "https://www.youtube.com/watch?v=1m5Ee9QbLF0", "published": "2026-08-21"}, {"channel": "MReflow", "title": "AI News: OpenAI Pauses, AI Cancer Vaccine, and Qwen3.8", "url": "https://www.youtube.com/watch?v=EfGF7QbJItA", "published": "2026-08-21"}, {"channel": "MReflow", "title": "Claude\u2019s Text Watermark Could Follow It Everywhere", "url": "https://www.youtube.com/watch?v=O-8TbMFOAfg", "published": "2026-08-20"}, {"channel": "MReflow", "title": "Your New Backup Brain Is Here", "url": "https://www.youtube.com/watch?v=r-ORCmsRHOE", "published": "2026-08-19"}, {"channel": "MReflow", "title": "Exclusive BTS of my Automated AI System (LIVE)", "url": "https://www.youtube.com/watch?v=IeT5Jn7d1aM", "published": "2026-08-18"}, {"channel": "MReflow", "title": "Are AI Models Escaping On Purpose?", "url": "https://www.youtube.com/watch?v=9ZKeu_7k9ik", "published": "2026-08-17"}, {"channel": "Maththew Berman", "title": "Grok Bot can shop for you! (I hope it doesn't though)", "url": "https://www.youtube.com/watch?v=EsgXT6TGY9A", "published": "2026-08-20"}, {"channel": "Maththew Berman", "title": "11 Grok Bot Use Cases That Feel Like Cheating", "url": "https://www.youtube.com/watch?v=5CSXUsljJ_E", "published": "2026-08-20"}, {"channel": "Maththew Berman", "title": "You NEED to try this 6 Open-Source Projects NOW", "url": "https://www.youtube.com/watch?v=1RTq_EWv2Yo", "published": "2026-08-17"}];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var index = 0;
var player = null;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: VIDEOS.length ? VIDEOS[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildList();
  update();
}

function buildList() {
  var list = document.getElementById("list");
  VIDEOS.forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var v = VIDEOS[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
}

function play(i) {
  index = (i + VIDEOS.length) % VIDEOS.length;
  var id = VIDEOS[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
