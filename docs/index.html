<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

2026-09-08"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "This Open Code Skill Just Destroyed AI Slop Forever with Anti-Slop Frontend Rules", "url": "https://www.youtube.com/watch?v=COCO6jjZZQg", "published": "2026-09-07"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Google Gemma 4: Growing Open-Source Ecosystem, Sizes, Features, and Real Projects", "url": "https://www.youtube.com/watch?v=bGhOj0nyjDI", "published": "2026-09-05"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Gemini 3.8 Flash is Crazy: What Actually Changed From 3.7", "url": "https://www.youtube.com/watch?v=yCKsqq87RPA", "published": "2026-09-04"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "I Tested Readdy AI on a Real Business Website", "url": "https://www.youtube.com/watch?v=mTZFkkeKBWU", "published": "2026-09-03"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Herdr: Run Claude Code, Codex and OpenCode Side by Side, Persistence Remote Sessions", "url": "https://www.youtube.com/watch?v=_jJc5VcrxyI", "published": "2026-09-02"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenCode + Ego Lite: Fewer Tool Calls, Lower Token Cost on Browser Automation", "url": "https://www.youtube.com/watch?v=Z3UdpTnpx8w", "published": "2026-09-01"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "Haiku Revisited: The Really Alternative OS", "url": "https://www.youtube.com/watch?v=1R4WCaOpmlo", "published": "2026-09-06"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "How to enable DLSS5 NVIDIA RTX 20, 30, 40, 50", "url": "https://www.youtube.com/watch?v=6V48uGSm6bk", "published": "2026-09-07"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "NVIDIA DLSS5 with PS2 emulator PCSX2", "url": "https://www.youtube.com/watch?v=vxr4kaKdtJs", "published": "2026-09-06"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Latest Xbox Insider Update. Disc to digital, var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
