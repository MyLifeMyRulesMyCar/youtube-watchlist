<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
var PLAYLISTS = {"AI": [{"playlist": "AI", "channel": "Fireship", "title": "The one OpenAI announcement that can actually make you money...", "url": "https://www.youtube.com/watch?v=No-JPdFvYWU", "published": "2026-10-01"}, {"playlist": "AI", "channel": "Fireship", "title": "Did a 50 year old military secret just solve agent prompt injection?", "url": "https://www.youtube.com/watch?v=I_KVMFrUtPk", "published": "2026-09-30"}, {"playlist": "AI", "channel": "Fireship", "title": "DHH has gone completely off the rails...", "url": "https://www.youtube.com/watch?v=OuNKBjuV7A4", "published": "2026-09-28"}, {"playlist": "AI", "channel": "MReflow", "title": "AI News: Dots, GPT-6.1 Sol, Sonnet 5.5, Gemini 4, and everything you need to know", "url": "https://www.youtube.com/watch?v=dDgncbBAA0c", "published": "2026-10-02"}, {"playlist": "AI", "channel": "MReflow", "title": "AI Made a Game I\u2019d ACTUALLY Play", "url": "https://www.youtube.com/watch?v=c7twMUavy5Q", "published": "2026-09-30"}, {"playlist": "AI", "channel": "MReflow", "title": "This AI Model Is INSANELY Fast & Cheap", "url": "https://www.youtube.com/watch?v=hx42whM7NsY", "published": "2026-09-28"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "DeepSeek Painted My Portrait", "url": "https://www.youtube.com/watch?v=jo70OkhryIA", "published": "2026-10-04"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Muse from Meta Can Work Through Your To-Do List", "url": "https://www.youtube.com/watch?v=OODvXcQJyVo", "published": "2026-10-01"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "OpenAI COOKED", "url": "https://www.youtube.com/watch?v=Xc6ERvZM1NY", "published": "2026-09-30"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "How Did Anthropic Pull This Off?", "url": "https://www.youtube.com/watch?v=T-E7rmD6rh4", "published": "2026-09-29"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "What We Built With Sonnet 5.5", "url": "https://www.youtube.com/watch?v=0NhtHVPQwt8", "published": "2026-09-29"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "EXL3 Quantization Explained: How Trellis Coding Shrinks Local LLMs, Same Quality", "url": "https://www.youtube.com/watch?v=QjpY2-cYw4Y", "published": "2026-10-04"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Fable 5.5 Is Reportedly Being Tested, Should Google and OpenAI Be Worried", "url": "https://www.youtube.com/watch?v=pSOY5qQD508", "published": "2026-10-03"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenDots: 100% Free Self-Hosted AI Agents That Actually Work (OpenAI Dots Open Source)", "url": "https://www.youtube.com/watch?v=iVINn_cr7oY", "published": "2026-10-03"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Gemini 4 Argon: Google's Strongest Model vs Opus 5.5 vs GPT 6 Astra, Benchmarks, Pricing,", "url": "https://www.youtube.com/watch?v=SKLxePku35Y", "published": "2026-10-02"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "CLM-8B: The Open Stanford and NVIDIA Model for Fast AI Agent Decisions", "url": "https://www.youtube.com/watch?v=wZzoM6XxSi8", "published": "2026-10-01"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenRouter's Newest Stealth Model Actually Beats GPT 6 Astra & it's 100% Free", "url": "https://www.youtube.com/watch?v=k2ABxY85e4g", "published": "2026-09-30"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Gemma 4 + Antigravity SDK: Run AI Agents Offline With Zero API Cost", "url": "https://www.youtube.com/watch?v=Xs_eXL5HS9E", "published": "2026-09-29"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Claude Code's INTENT.MD: New Planning Workflow for Engineering Teams", "url": "https://www.youtube.com/watch?v=Vxw9DQjsrHY", "published": "2026-09-28"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "Linux Update October 2026", "url": "https://www.youtube.com/watch?v=VSTTre31k9w", "published": "2026-10-04"}, {"playlist": "Hardware", "channel": "Platima Tinkers", "title": "TrustKernel PlugMate Review: Great Hardware, Software Needs Work", "url": "https://www.youtube.com/watch?v=N0p3JyB5aho", "published": "2026-10-04"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "How to Check Your Raspberry Pi\u2019s RAM Is Genuine & Supported", "url": "https://www.youtube.com/watch?v=ZKSaNS3a1IU", "published": "2026-10-01"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "WiiM Sound Review: So Many Ways to Play Music", "url": "https://www.youtube.com/watch?v=6bBtIG8oQeY", "published": "2026-09-28"}, {"playlist": "Hardware", "channel": "Jeff Geerling", "title": "I can't afford RAM, so I'm upgrading my 1989 Mac instead", "url": "https://www.youtube.com/watch?v=-vtFNuPM5zY", "published": "2026-10-03"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "WTF is Going On? | The \"AI Constitution\" & Regulation", "url": "https://www.youtube.com/watch?v=-HzHFSxRcro", "published": "2026-10-05"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "It's Time to Hack Your Devices and Own Them", "url": "https://www.youtube.com/watch?v=z6sF3pLsbKI", "published": "2026-10-02"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "\"We Know Some Will Call This Circular Financing\" - NVIDIA", "url": "https://www.youtube.com/watch?v=EhgjJBcc0Es", "published": "2026-09-29"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
