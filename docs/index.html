<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>

 "published": "2026-11-17"}, {"playlist": "AI", "channel": "MReflow", "title": "This had never been done before!", "url": "https://www.youtube.com/watch?v=btjS7OaffpM", "published": "2026-11-16"}, {"playlist": "AI", "channel": "MReflow", "title": "3D Printing Entire Buildings is So Wild To Me", "url": "https://www.youtube.com/watch?v=ETw45WHQ6Z4", "published": "2026-11-16"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "I\u2019m Crashing Out About Anthropic", "url": "https://www.youtube.com/watch?v=I0Fasi1-teQ", "published": "2026-11-21"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Six Robots Worked a 24-Hour Shift at a Shanghai Convenience Store", "url": "https://www.youtube.com/watch?v=BoBe0tepch4", "published": "2026-11-20"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Gemini 4 Neon is ridiculous...", "url": "https://www.youtube.com/watch?v=5eON_8rgKzk", "published": "2026-11-20"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "I Gave Hark Pro Three Everyday Tasks", "url": "https://www.youtube.com/watch?v=2qd2LEXDYpo", "published": "2026-11-19"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "What's going on with GPT-6.2?", "url": "https://www.youtube.com/watch?v=nEYuoqqMgyg", "published": "2026-11-19"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "POV: The diff after I asked Claude to fix my app", "url": "https://www.youtube.com/watch?v=FUj0a5B6bVk", "published": "2026-11-19"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Box CEO Explains Why AI Makes Software Features Obsolete", "url": "https://www.youtube.com/watch?v=kMdHCyAnNHA", "published": "2026-11-16"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenMausBot: Free Open Source Alternative to Grok Bot, Meta Muse and OpenAI Dots", "url": "https://www.youtube.com/watch?v=4JaSP5L4cqg", "published": "2026-11-21"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Superpowers + OpenCode:  Spec-First AI Coding Workflow is 100X Better Than Vibe Coding", "url": "https://www.youtube.com/watch?v=tA1jKARjlh8", "published": "2026-11-20"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenCode + Qwen4 Max: How to Set Up a Cheaper & Powerful Coding Agent", "url": "https://www.youtube.com/watch?v=RHnQzc4BX6k", "published": "2026-11-19"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Higgsfield AI Tutorial 2026: How to Use Higgsfield AI for Product Videos", "url": "https://www.youtube.com/watch?v=LD_DudA-VC4", "published": "2026-11-19"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Stanford Memorilla: Long-Term LLM Memory Without Bigger Context", "url": "https://www.youtube.com/watch?v=RCEF4h2gdjk", "published": "2026-11-18"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "FreeLLMAPI: Run Claude Code, Codex and OpenCode 100% FREE, 10B Tokens, 87 Providers", "url": "https://www.youtube.com/watch?v=ZlcSPH7wH6I", "published": "2026-11-17"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Meta Astryx: FREE  & Open Source Design System, 150+ React Components, Themes and CLI", "url": "https://www.youtube.com/watch?v=KmelFG6DsDw", "published": "2026-11-16"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "KDE Linux: Alpha Immutable Distro", "url": "https://www.youtube.com/watch?v=d2h15WJCz9k", "published": "2026-11-15"}, {"playlist": "Hardware", "channel": "Platima Tinkers", "title": "ESP Mosaico Review: Espressif\u2019s ESP32-S31 Dev Kit With an AMOLED Screen", "url": "https://www.youtube.com/watch?v=ZNQKE2a_B2I", "published": "2026-11-16"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "GTA VI Access a plane on Day one.", "url": "https://www.youtube.com/watch?v=AJd5PfvMNnk", "published": "2026-11-20"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "The Ultimate Thunderbolt 5 USB C Dock. Orico TB5", "url": "https://www.youtube.com/watch?v=i9_5mhP_54M", "published": "2026-11-19"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Power Old and New devices from a Power Bank", "url": "https://www.youtube.com/watch?v=4A-lj4cYrQM", "published": "2026-11-16"}, {"playlist": "Hardware", "channel": "Jeff Geerling", "title": "I'm giving the whole Internet a good time", "url": "https://www.youtube.com/watch?v=fWXB5u4lXk0", "published": "2026-11-18"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "RAM Altman", "url": "https://www.youtube.com/watch?v=KNVKzPHgg4M", "published": "2026-11-19"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "IF ONLY SOMEBODY TOLD US ABOUT THE NVIDIA GPU SMUGGLING", "url": "https://www.youtube.com/watch?v=SxFJ5QGNxwo", "published": "2026-11-16"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
