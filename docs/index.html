<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>

laylist": "AI", "channel": "Maththew Berman", "title": "Two AI bots for spam calls and data privacy", "url": "https://www.youtube.com/watch?v=IrgQdsxzRa4", "published": "2026-10-29"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Google \"Carbon\" just won everything...", "url": "https://www.youtube.com/watch?v=zhnJo7s91ls", "published": "2026-10-29"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Google announces Gemini 4 Carbon", "url": "https://www.youtube.com/watch?v=3yZb9rGt-rk", "published": "2026-10-28"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Deepseek crushed everyone", "url": "https://www.youtube.com/watch?v=DDZ-a6bAn3Y", "published": "2026-10-28"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "I Ranked 5 Ways to Wake Up", "url": "https://www.youtube.com/watch?v=mMzaL15KFVY", "published": "2026-10-27"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Anthropic\u2019s IPO: Who Gets the Voting Power?", "url": "https://www.youtube.com/watch?v=jeUgtyvvkfs", "published": "2026-10-27"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "This is much more concerning than you think...", "url": "https://www.youtube.com/watch?v=JI3bbZNdyeA", "published": "2026-10-27"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Kimi K3.1 Passes the Rubik's Cube Test", "url": "https://www.youtube.com/watch?v=L18lkQs4PeM", "published": "2026-10-25"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Sam Altman on What People Still Bring to an AI World", "url": "https://www.youtube.com/watch?v=eQTOJZ6_NVU", "published": "2026-10-25"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenDuet: 100% Free and Self-Hosted Open Source Alternative to Claude Duet", "url": "https://www.youtube.com/watch?v=J0tfcjHLOlk", "published": "2026-10-31"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Oh My Hermes: Turns Hermes Agent into a Parallel Coding Team with a Model for Every Task", "url": "https://www.youtube.com/watch?v=Ui0liAE5zes", "published": "2026-10-30"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenMuse: Free Self-Hosted Meta Muse Alternative With Browser and Terminal", "url": "https://www.youtube.com/watch?v=toR7uAQun1I", "published": "2026-10-29"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Scalekit vs Composio: Choosing an MCP Gateway for Enterprise AI Agents", "url": "https://www.youtube.com/watch?v=N1h9bNQn560", "published": "2026-10-28"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "CLI Anything: Turn Any Desktop App Into a Tool Your AI Agent Can Use", "url": "https://www.youtube.com/watch?v=wP8ldo7xLIg", "published": "2026-10-27"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenBot: Free Desktop App for Persistent AI Agent Teams with Claude Code, OpenCode", "url": "https://www.youtube.com/watch?v=luqFKMdbw3w", "published": "2026-10-26"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "GPU Upgrade for Local AI", "url": "https://www.youtube.com/watch?v=9G3d9MwKAW8", "published": "2026-10-25"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Ubuntu 26.10 Raspberry Pi 5", "url": "https://www.youtube.com/watch?v=wGG8yy2O3Ls", "published": "2026-10-26"}, {"playlist": "Hardware", "channel": "Top Projects Compilation", "title": "15 Electronics Mistakes That Separate Beginners From Experts", "url": "https://www.youtube.com/watch?v=VzVat_vKBMg", "published": "2026-10-27"}, {"playlist": "Hardware", "channel": "Jeff Geerling", "title": "REJOICE! NO MORE LEAP SECONDS!", "url": "https://www.youtube.com/watch?v=vFMU2m-TZ3s", "published": "2026-10-30"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "HW News - OpenAI Says You Waste RAM, Jailbreak Everything, RIP RTX 5080, Anthropic IPO", "url": "https://www.youtube.com/watch?v=t61q4kCbH9M", "published": "2026-11-01"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "Fixing the Vertical GPU Problem | HAVN HS 360 Case Review, Thermals, & Benchmarks", "url": "https://www.youtube.com/watch?v=OgHTveiHy4Y", "published": "2026-10-29"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "Own Everything & Be Happy, Ep. 1 | DIY Router Guide", "url": "https://www.youtube.com/watch?v=sJidlu3pPb4", "published": "2026-10-26"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
