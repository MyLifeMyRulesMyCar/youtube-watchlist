<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
var PLAYLISTS = {"AI": [{"playlist": "AI", "channel": "Fireship", "title": "The one thing holding theoretical CS together just broke... kinda", "url": "https://www.youtube.com/watch?v=iw9SZgyahqg", "published": "2026-11-06"}, {"playlist": "AI", "channel": "Fireship", "title": "The worst week in cybersecurity history... so far", "url": "https://www.youtube.com/watch?v=k2ruCf_z75I", "published": "2026-11-03"}, {"playlist": "AI", "channel": "MReflow", "title": "Claude Code Just Called My Phone", "url": "https://www.youtube.com/watch?v=A5SfzBD6M3o", "published": "2026-11-07"}, {"playlist": "AI", "channel": "MReflow", "title": "That is Some Crazy Fabric", "url": "https://www.youtube.com/watch?v=w3z3Fa7ACt8", "published": "2026-11-07"}, {"playlist": "AI", "channel": "MReflow", "title": "AI News: New ChatGPT & Google Models (14 Updates Worth Knowing)", "url": "https://www.youtube.com/watch?v=IrAHINf0M6E", "published": "2026-11-06"}, {"playlist": "AI", "channel": "MReflow", "title": "What will people REALLY use these for?", "url": "https://www.youtube.com/watch?v=hniPlxcQ7X4", "published": "2026-11-05"}, {"playlist": "AI", "channel": "MReflow", "title": "How I Get Claude To Edit My Videos (Step-By-Step)", "url": "https://www.youtube.com/watch?v=ep4psgAFOqc", "published": "2026-11-04"}, {"playlist": "AI", "channel": "MReflow", "title": "A real-life speeder bike from Return of the Jedi (Not AI)", "url": "https://www.youtube.com/watch?v=PRAY_SewRxI", "published": "2026-11-03"}, {"playlist": "AI", "channel": "MReflow", "title": "Generate Worlds in Real-Time (Free & Open Source)", "url": "https://www.youtube.com/watch?v=lZes3U_WIug", "published": "2026-11-02"}, {"playlist": "AI", "channel": "MReflow", "title": "Would you be excited to see this at Disneyland?", "url": "https://www.youtube.com/watch?v=h5SNFLIZl_U", "published": "2026-11-02"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "12 months to the singularity", "url": "https://www.youtube.com/watch?v=lVbQqjAJpk g", "published": "2026-11-05"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenBot: Open Source AI Coworker Platform, Self-Hosted Claude Duet and OpenCode Alternative", "url": "https://www.youtube.com/watch?v=aig_YvStGsY", "published": "2026-11-04"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Google Just Open Sourced Its AI Coding Secret: FREE Elephant Goldfish Model", "url": "https://www.youtube.com/watch?v=6zQ2xIXpLa8", "published": "2026-11-03"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenHands Agent Canvas: Run Claude Code, Codex and OpenCode From One Dashboard", "url": "https://www.youtube.com/watch?v=5bIQo-FGUAI", "published": "2026-11-02"}], "Hardware": [{"playlist": "Hardware", "channel": "Platima Tinkers", "title": "Smallest SBC I've Ever Reviewed: Aimorelogy Ovis Edge AI Camera", "url": "https://www.youtube.com/watch?v=JTGDSCIOM2U", "published": "2026-11-02"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "I bought the unavailable 1GB Pi5\u2026. Or did I?", "url": "https://www.youtube.com/watch?v=CV2kG36avEA", "published": "2026-11-05"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Many Lies told. I still recommend this \u00a330 console.", "url": "https://www.youtube.com/watch?v=9V1n9W57270", "published": "2026-11-02"}, {"playlist": "Hardware", "channel": "Top Projects Compilation", "title": "What Resistors Really Do in Electronics? 12 Circuits", "url": "https://www.youtube.com/watch?v=Ocjd_WgZTvM", "published": "2026-11-06"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "The NVIDIA RTX 5090 Problem & Future Generation Price Creep", "url": "https://www.youtube.com/watch?v=Un78sPq5nbg", "published": "2026-11-07"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "ISPs Can Use WiFi to See You | Discussing WiFi Sensing, ft. Wendell of Level1 Techs", "url": "https://www.youtube.com/watch?v=5HjnQYS1QOc", "published": "2026-11-05"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "Investigation: How Tech & AI Companies Corrupt Elections", "url": "https://www.youtube.com/watch?v=lvGOv539YIE", "published": "2026-11-03"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "NVIDIA's $2000/Year GPUs and Becoming a Defense Contractor", "url": "https://www.youtube.com/watch?v=KbWm2MHL2i0", "published": "2026-11-02"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
