<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .tabs { margin-bottom: 14px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; cursor: pointer;
                 background: #1a1a1a; color: #eee; border: 1px solid #333;
                 border-radius: 4px; font-size: 14px; }
  .tabs button.active { background: #c00; border-color: #c00; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Videos</h3>
    <ul id="list"></ul>
  </div>
</div>

": "MReflow", "title": "This Airtaxi is Ready For Primetime!", "url": "https://www.youtube.com/watch?v=GcFRheDNh5U", "published": "2026-11-10"}, {"playlist": "AI", "channel": "MReflow", "title": "Anthropic's Fable 5.2 is the World\u2019s Best AI Model", "url": "https://www.youtube.com/watch?v=2TM8W66NI_8", "published": "2026-11-09"}, {"playlist": "AI", "channel": "MReflow", "title": "This controls games characters AND robots", "url": "https://www.youtube.com/watch?v=jKjir4-HmQI", "published": "2026-11-08"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Who controls access to AI?", "url": "https://www.youtube.com/watch?v=yVaVR2Ywfik", "published": "2026-11-13"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Anthropic Researcher explains how to train LLMs", "url": "https://www.youtube.com/watch?v=Sjdvu4nHfDk", "published": "2026-11-12"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Cheaper AI can lead to more spending", "url": "https://www.youtube.com/watch?v=G11-Vmw7-PQ", "published": "2026-11-12"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Let AI redesign your work", "url": "https://www.youtube.com/watch?v=TzZmDf60hIQ", "published": "2026-11-12"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "AMA with me and the team!", "url": "https://www.youtube.com/watch?v=LFzBzzHZESE", "published": "2026-11-11"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Gemini Carbon, NVIDIA CEO AFFAIR, Fable 5.2, Meta Muse Ember, GPT Image 2.6, Minimax H3: AI NEWS", "url": "https://www.youtube.com/watch?v=FCmLuTENOp0", "published": "2026-11-11"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "What software provides when AI bypasses the interface", "url": "https://www.youtube.com/watch?v=ZBJV-hA-tLM", "published": "2026-11-11"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "AI made Box features obsolete before launch", "url": "https://www.youtube.com/watch?v=L2acYRMzig8", "published": "2026-11-10"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Fable 5.2 just solved software", "url": "https://www.youtube.com/watch?v=oW98tLm7suY", "published": "2026-11-10"}, {"playlist": "AI", "channel": "Maththew Berman", "title": "Fable 5.2 solved all software...", "url": "https://www.youtube.com/watch?v=0vNyVMDFdkg", "published": "2026-11-09"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Google Antigravity Swarm Mode: Multi-Agent Works with Gemini 4 Carbon & Hydrogen", "url": "https://www.youtube.com/watch?v=H9hixcRn-Bk", "published": "2026-11-14"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "DeepSeek SuperAgent: 100% FREE Coding Agent, Works Without Constant Prompting", "url": "https://www.youtube.com/watch?v=P9zZEIq6bBM", "published": "2026-11-13"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Microsoft TokenEconomizer: Cut Claude Code OpenCode and Codex Costs by Up to 31%", "url": "https://www.youtube.com/watch?v=mtoAxBP3Pag", "published": "2026-11-12"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "Self-Hosted AI Agent Integration Platforms Compared: Scalekit, Composio, Nango, Arcade, Paragon", "url": "https://www.youtube.com/watch?v=2bXvw-bPAoc", "published": "2026-11-10"}, {"playlist": "AI", "channel": "AI Stack Engineer", "title": "OpenCode Hex: 100% Free & Local Voice Dictation for AI Coding Agents", "url": "https://www.youtube.com/watch?v=7fbMk1hdgf4", "published": "2026-11-09"}], "Hardware": [{"playlist": "Hardware", "channel": "ExplainingComputers", "title": "Radical Computing Evolution", "url": "https://www.youtube.com/watch?v=MWR7unDDJhA", "published": "2026-11-08"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "AAA PC Gaming on a 2GB Raspberry Pi4! Boosteroid", "url": "https://www.youtube.com/watch?v=QOEZ7vR-xVo", "published": "2026-11-12"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Zelda Ocarina of time remake. Switch 2 Display stand plays a tune when you walk past.", "url": "https://www.youtube.com/watch?v=Hd9HQrOd5Kk", "published": "2026-11-11"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Pi News 109. Pi Zero 3W & Pi4 Model A", "url": "https://www.youtube.com/watch?v=pXBsUjG0ssA", "published": "2026-11-09"}, {"playlist": "Hardware", "channel": "Leepsvideo", "title": "Emergency Radio options. Samsung Galaxy S3 from 2012. Or Wind up FM Radios", "url": "https://www.youtube.com/watch?v=33mpA4z-NJk", "published": "2026-11-09"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "Tim Sweeney is a Lunatic | WTF Happened to Epic Games?", "url": "https://www.youtube.com/watch?v=jHT4iHJxzOI", "published": "2026-11-14"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "The Downfall of Jensen Huang: NVIDIA\u2019s Greed & Corruption", "url": "https://www.youtube.com/watch?v=YYU_geUwQoA", "published": "2026-11-13"}, {"playlist": "Hardware", "channel": "Gamers Nexus", "title": "It's Time to Get Into 3D Printing | GN \"Factory\" Build Vlog, Pt. 1", "url": "https://www.youtube.com/watch?v=rhQc2SPV3tQ", "published": "2026-11-08"}]};
var ORDER = ["AI", "Hardware"];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var current = ORDER.length ? ORDER[0] : null;
var index = 0;
var player = null;

function playlist() { return PLAYLISTS[current] || []; }

function onYouTubeIframeAPIReady() {
  var first = playlist();
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: first.length ? first[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildTabs();
  buildList();
  update();
}

function buildTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDER.forEach(function (name) {
    var b = document.createElement("button");
    b.textContent = name + " (" + PLAYLISTS[name].length + ")";
    b.onclick = function () { switchPlaylist(name); };
    tabs.appendChild(b);
  });
}

function switchPlaylist(name) {
  if (name === current) return;
  current = name;
  index = 0;
  buildList();
  play(0);
}

function buildList() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  playlist().forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var vids = playlist();
  if (!vids.length) return;
  var v = vids[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
  var buttons = document.querySelectorAll("#tabs button");
  ORDER.forEach(function (n, i) {
    buttons[i].className = n === current ? "active" : "";
  });
}

function play(i) {
  var vids = playlist();
  if (!vids.length) return;
  index = (i + vids.length) % vids.length;
  var id = vids[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
