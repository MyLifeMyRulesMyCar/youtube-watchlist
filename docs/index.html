<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Watchlist Player</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #0f0f0f; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; max-width: 1200px; }
  .main { flex: 1; }
  #player { width: 100%; max-width: 854px; aspect-ratio: 16/9; background: #000; }
  #info { margin: 10px 0; font-size: 16px; color: #ccc; }
  #info .channel { color: #f00; font-weight: bold; margin-right: 8px; }
  .controls { margin: 10px 0; }
  .controls button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .sidebar { width: 320px; max-height: 80vh; overflow-y: auto; }
  .sidebar h3 { margin-top: 0; }
  .sidebar ul { list-style: none; padding: 0; margin: 0; }
  .sidebar li { padding: 8px; margin-bottom: 4px; background: #1a1a1a; border-radius: 4px;
                cursor: pointer; font-size: 13px; }
  .sidebar li.active { background: #c00; }
  .sidebar li .ch { color: #888; font-size: 11px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div id="player"></div>
    <div id="info"></div>
    <div class="controls">
      <button onclick="prev()">Prev (P)</button>
      <button onclick="togglePlay()">Play / Pause (Space)</button>
      <button onclick="next()">Next (N)</button>
      <button onclick="quit()">Close (Q)</button>
    </div>
    <div class="hint">Keyboard: Space = play/pause &nbsp;|&nbsp; N = next &nbsp;|&nbsp; P = previous &nbsp;|&nbsp; Q = close</div>
  </div>
  <div class="sidebar">
    <h3>Playlist</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
var VIDEOS = [{"channel": "Fireship", "title": "This new startup can query anywhere you've been...", "url": "https://www.youtube.com/watch?v=E7la7-dtfVM", "published": "2026-08-14"}, {"channel": "Fireship", "title": "Meta's new model wants \"deep access\" to your personal life...", "url": "https://www.youtube.com/watch?v=G55HSGpuh1M", "published": "2026-08-12"}, {"channel": "Fireship", "title": "I spent 3 days at MIT... the robot hype is worse than you think", "url": "https://www.youtube.com/watch?v=aB5LGrHISqY", "published": "2026-08-11"}, {"channel": "MReflow", "title": "Hank Green did nothing wrong", "url": "https://www.youtube.com/watch?v=ZePfpQ7lbcs", "published": "2026-08-15"}, {"channel": "MReflow", "title": "3 New Ways To Use ChatGPT Codex", "url": "https://www.youtube.com/watch?v=aszRSGI_Iwg", "published": "2026-08-15"}, {"channel": "MReflow", "title": "AI News: A Flood of New Models (Here's What Matters)", "url": "https://www.youtube.com/watch?v=NC4h5kWH_-A", "published": "2026-08-14"}, {"channel": "MReflow", "title": "Did This AI Company Go Too Far...?", "url": "https://www.youtube.com/watch?v=MVOWGGrVTOs", "published": "2026-08-14"}, {"channel": "MReflow", "title": "Anyone Can Make Amazing Games Now (Easy)", "url": "https://www.youtube.com/watch?v=qK4nV_LnXxQ", "published": "2026-08-13"}, {"channel": "Maththew Berman", "title": "AI News: ChatGPT Ultrafast, Grok 4.6, 3 New Open-Source Models, and more!", "url": "https://www.youtube.com/watch?v=9qix4oDB5aw", "published": "2026-08-14"}, {"channel": "Maththew Berman", "title": "xAI actually did it... (Grok 4.6)", "url": "https://www.youtube.com/watch?v=rdYBjpylJUQ", "published": "2026-08-13"}, {"channel": "Maththew Berman", "title": "Cursor just made something incredible...", "url": "https://www.youtube.com/watch?v=mZM-J7XK5Aw", "published": "2026-08-12"}, {"channel": "Maththew Berman", "title": "Faster AND Cheaper AI", "url": "https://www.youtube.com/watch?v=i_t-99u6pqw", "published": "2026-08-11"}, {"channel": "Maththew Berman", "title": "Mark Zuckerberg just called out Dario (and Anthropic)", "url": "https://www.youtube.com/watch?v=hZqJvWDI0Rs", "published": "2026-08-11"}, {"channel": "Maththew Berman", "title": "AI went rogue in real life...", "url": "https://www.youtube.com/watch?v=mixeobHQ7ao", "published": "2026-08-10"}];
var ORIGIN = "https://mylifemyrulesmycar.github.io";
var index = 0;
var player = null;

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    height: "480",
    width: "854",
    videoId: VIDEOS.length ? VIDEOS[0].url.split("v=")[1] : null,
    playerVars: { autoplay: 1, rel: 0, origin: ORIGIN },
    events: { onStateChange: onStateChange }
  });
  buildList();
  update();
}

function buildList() {
  var list = document.getElementById("list");
  VIDEOS.forEach(function (v, i) {
    var li = document.createElement("li");
    li.setAttribute("data-i", i);
    var ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = v.channel;
    li.appendChild(ch);
    li.appendChild(document.createTextNode(v.title));
    li.onclick = function () { play(i); };
    list.appendChild(li);
  });
}

function update() {
  var v = VIDEOS[index];
  document.getElementById("info").innerHTML =
    '<span class="channel">' + v.channel + '</span>' + v.title;
  var items = document.querySelectorAll("#list li");
  items.forEach(function (li, i) {
    li.className = i === index ? "active" : "";
  });
}

function play(i) {
  index = (i + VIDEOS.length) % VIDEOS.length;
  var id = VIDEOS[index].url.split("v=")[1];
  player.loadVideoById(id);
  update();
}

function next() { play(index + 1); }
function prev() { play(index - 1); }

function togglePlay() {
  if (!player) return;
  if (player.getPlayerState() === 1) player.pauseVideo();
  else player.playVideo();
}

function onStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) next();
}

function quit() {
  try { fetch("/quit"); } catch (err) {}
  document.body.innerHTML = "<h2 style='padding:40px'>Session ended. You can close this tab.</h2>";
}

document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "KeyN") { next(); }
  else if (e.code === "KeyP") { prev(); }
  else if (e.code === "KeyQ") { quit(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
